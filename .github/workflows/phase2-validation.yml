name: Phase 2 Validation

on:
  push:
    branches:
      - feature/phase-2-stability-opportunity-engine

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Build and test
        run: npm run build
